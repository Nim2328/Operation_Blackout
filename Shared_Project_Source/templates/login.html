<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Investigator Login | Operation Blackout</title>

    <style>
        body {
            margin: 0;
            background: #080b10;
            color: #e6edf3;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
        }

        .panel {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 35px;
        }

        .label {
            color: #7ee787;
            font-size: 12px;
            letter-spacing: 2px;
        }

        h1 {
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            background: #161b22;
            border: 1px solid #30363d;
            color: white;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #238636;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #ff7b72;
            margin-bottom: 20px;
        }

        a {
            color: #7ee787;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="panel">

        <span class="label">
            CLASSIFIED // INVESTIGATOR ACCESS
        </span>

        <h1>Investigator Login</h1>

        <p>
            Operation Blackout
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label>Investigator ID</label>

            <input
                type="text"
                name="username"
                required
                autocomplete="username"
            >

            <label>Access Password</label>

            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                AUTHENTICATE
            </button>

        </form>

        <p>
            New investigator?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

</body>
</html>
