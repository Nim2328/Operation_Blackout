<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Investigator Registration</title>

    <style>
        body {
            margin: 0;
            background: #080b10;
            color: #e6edf3;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
        }

        .panel {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 35px;
        }

        .label {
            color: #7ee787;
            letter-spacing: 2px;
            font-size: 12px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            background: #161b22;
            border: 1px solid #30363d;
            color: white;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #238636;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
        }

        .error {
            color: #ff7b72;
        }

        a {
            color: #7ee787;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="panel">

        <span class="label">
            OPERATION BLACKOUT
        </span>

        <h1>Register Investigator</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <label>Investigator ID</label>

            <input
                type="text"
                name="username"
                required
            >

            <label>Team Name</label>

            <input
                type="text"
                name="team_name"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                CREATE INVESTIGATOR
            </button>

        </form>

        <p>
            Already registered?
            <a href="/login">Login</a>
        </p>

    </div>

</div>

</body>
</html>
